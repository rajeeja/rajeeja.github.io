# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
title                    : "Rajeev Jain"
title_separator          : "-"
name                     : &name "Rajeev Jain"
description              : &description "Principal Specialist in Research Software Engineering at Argonne National Laboratory. Scientific computing and HPC since 2009; now building AI agent infrastructure and checking what it produces against measurement."
url                      : https://rajeeja.github.io # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "rajeeja/rajeeja.github.io"
future                   : true
atom_feed:
  path                   : # blank (default) uses feed.xml

# SEO Related
google_site_verification :
bing_site_verification   :

# Social Sharing
og_image                 : "og-card.png" # Open Graph/Twitter default site image (1200x630)
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : "Person" # Person or Organization (defaults to Person)
  name                   : "Rajeev Jain" # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles
    - "https://github.com/rajeeja"
    - "https://www.linkedin.com/in/rajeeja/"
    - "https://scholar.google.com/citations?user=bC77n9MAAAAJ&hl=en"
    - "https://orcid.org/0000-0002-1235-918X"
    - "https://www.researchgate.net/profile/Rajeev-Jain-7"


# Analytics
analytics:
  provider               : "google-gtag" # false (default), "google", "google-universal", "custom"
  google:
    measurement_id       : "G-KRCJNWVJSV"


# Site Author
author:
  name             : "Rajeev Jain"
  avatar           : "profile.png"
  bio		   : "Principal Specialist, Research Software Engineering at Argonne. HPC and scientific computing since 2009. Builds AI agent tooling, then checks it against a measurement."
  cv		   : "https://rajeeja.github.io/files/Rajeev_Jain_CV.pdf"
  location         : "Chicago, IL"
  googlescholar    : "https://scholar.google.com/citations?user=bC77n9MAAAAJ&hl=en"
  researchgate     : "https://www.researchgate.net/profile/Rajeev-Jain-7"
  github           : "rajeeja"
  linkedin         : "rajeeja"
  orcid            : "https://orcid.org/0000-0002-1235-918X"


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
  - vendor
  - images/blog/originals
  - "job applications"
  - soa-*.txt
  - cv-*.txt
  - "*.tex"
  - "*.aux"
  - "*.log"
  - "*.out"
  - "*.fls"
  - "*.fdb_latexmk"
  - scripts
  - cv
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections: {}


# Defaults
# _layouts/single.html renders title, date/excerpt meta, content, and the
# "All posts" footer link — nothing else. Author-profile, comments, share,
# related-posts, breadcrumb, and toc settings have no partial to render them,
# so they are deliberately absent here.
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: America/Chicago # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
