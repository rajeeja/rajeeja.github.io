<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The SCRIP corner table versus the deduplicated mesh</title>
  <desc id="desc">On the left, a SCRIP corner table of 3.6 billion longitude and latitude rows totalling 53.6 GiB, in which the coordinates of a shared vertex are restated once for every face that touches it. On the right, the deduplicated result: a unique vertex table of 500 million rows at 7.5 GiB, plus an integer connectivity array that indexes into it. Arrows show four separate corner rows carrying identical coordinates collapsing onto a single unique vertex.</desc>
  <rect width="1400" height="780" rx="28" fill="#F8F5EF"/>
  <rect x="28" y="28" width="1344" height="724" rx="22" fill="#FFFCF8" stroke="#D9D2C6" stroke-width="2"/>
  <text x="72" y="94" fill="#1C2430" font-family="IBM Plex Sans, Arial, sans-serif" font-size="36" font-weight="700">SCRIP stores every shared vertex once per face</text>
  <text x="72" y="132" fill="#546170" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19">Deduplicating is the reader's whole job — and the answer is seven times smaller than the input it comes from.</text>

  <!-- Left: the corner table -->
  <rect x="88" y="176" width="540" height="524" rx="26" fill="#FFFFFF" stroke="#CBD4DE" stroke-width="2"/>
  <text x="124" y="222" fill="#8C3B2E" font-family="IBM Plex Sans, Arial, sans-serif" font-size="26" font-weight="700">Corner table, as stored</text>
  <text x="124" y="250" fill="#546170" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17">grid_corner_lon / lat  (grid_size &#215; grid_corners)</text>

  <!-- column headers -->
  <text x="124" y="296" fill="#7A8593" font-family="IBM Plex Mono, monospace" font-size="15">face  corner            lon        lat</text>
  <line x1="124" y1="308" x2="592" y2="308" stroke="#E2DCD2" stroke-width="2"/>

  <!-- rows: four duplicates of the same vertex, highlighted -->
  <rect x="116" y="318" width="484" height="34" rx="8" fill="#FDF0EC"/>
  <text x="124" y="341" fill="#1C2430" font-family="IBM Plex Mono, monospace" font-size="15">  17       2      -98.7500    31.2500</text>
  <rect x="116" y="356" width="484" height="34" rx="8" fill="#FFFFFF"/>
  <text x="124" y="379" fill="#546170" font-family="IBM Plex Mono, monospace" font-size="15">  17       3      -98.7188    31.2500</text>
  <rect x="116" y="394" width="484" height="34" rx="8" fill="#FDF0EC"/>
  <text x="124" y="417" fill="#1C2430" font-family="IBM Plex Mono, monospace" font-size="15">  18       0      -98.7500    31.2500</text>
  <rect x="116" y="432" width="484" height="34" rx="8" fill="#FDF0EC"/>
  <text x="124" y="455" fill="#1C2430" font-family="IBM Plex Mono, monospace" font-size="15">  42       1      -98.7500    31.2500</text>
  <rect x="116" y="470" width="484" height="34" rx="8" fill="#FFFFFF"/>
  <text x="124" y="493" fill="#546170" font-family="IBM Plex Mono, monospace" font-size="15">  42       2      -98.7812    31.2188</text>
  <rect x="116" y="508" width="484" height="34" rx="8" fill="#FDF0EC"/>
  <text x="124" y="531" fill="#1C2430" font-family="IBM Plex Mono, monospace" font-size="15">  43       0      -98.7500    31.2500</text>
  <text x="124" y="569" fill="#9AA3AE" font-family="IBM Plex Mono, monospace" font-size="15">   ...</text>

  <text x="124" y="620" fill="#8C3B2E" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">3,599,989,944 rows</text>
  <text x="124" y="648" fill="#546170" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17">53.6 GiB as float64 lon + lat</text>
  <text x="124" y="678" fill="#8C3B2E" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17">the four shaded rows are one vertex, written four times</text>

  <!-- Arrow -->
  <path d="M 648 440 L 736 440" stroke="#355E3B" stroke-width="3" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#355E3B"/>
    </marker>
  </defs>
  <text x="692" y="424" fill="#355E3B" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">dedup</text>

  <!-- Right: unique vertices + connectivity -->
  <rect x="772" y="176" width="540" height="524" rx="26" fill="#FFFFFF" stroke="#CBD4DE" stroke-width="2"/>
  <text x="808" y="222" fill="#355E3B" font-family="IBM Plex Sans, Arial, sans-serif" font-size="26" font-weight="700">What the mesh needs</text>
  <text x="808" y="250" fill="#546170" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17">a vertex list, plus integer indices into it</text>

  <text x="808" y="296" fill="#7A8593" font-family="IBM Plex Mono, monospace" font-size="15">node        lon        lat</text>
  <line x1="808" y1="308" x2="1276" y2="308" stroke="#E2DCD2" stroke-width="2"/>
  <rect x="800" y="318" width="484" height="34" rx="8" fill="#ECF5EE"/>
  <text x="808" y="341" fill="#1C2430" font-family="IBM Plex Mono, monospace" font-size="15">8814    -98.7500    31.2500</text>
  <rect x="800" y="356" width="484" height="34" rx="8" fill="#FFFFFF"/>
  <text x="808" y="379" fill="#546170" font-family="IBM Plex Mono, monospace" font-size="15">8815    -98.7188    31.2500</text>
  <rect x="800" y="394" width="484" height="34" rx="8" fill="#FFFFFF"/>
  <text x="808" y="417" fill="#546170" font-family="IBM Plex Mono, monospace" font-size="15">8816    -98.7812    31.2188</text>
  <text x="808" y="452" fill="#9AA3AE" font-family="IBM Plex Mono, monospace" font-size="15"> ...</text>

  <text x="808" y="500" fill="#7A8593" font-family="IBM Plex Mono, monospace" font-size="15">face_node_connectivity   (stays lazy)</text>
  <line x1="808" y1="512" x2="1276" y2="512" stroke="#E2DCD2" stroke-width="2"/>
  <rect x="800" y="522" width="484" height="34" rx="8" fill="#F3F6FA"/>
  <text x="808" y="545" fill="#1C2430" font-family="IBM Plex Mono, monospace" font-size="15">  17  &#8594;  [ ..., 8814, 8815, ... ]</text>
  <rect x="800" y="560" width="484" height="34" rx="8" fill="#F3F6FA"/>
  <text x="808" y="583" fill="#1C2430" font-family="IBM Plex Mono, monospace" font-size="15">  18  &#8594;  [ 8814, ...           ]</text>

  <text x="808" y="632" fill="#355E3B" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">500,001,289 unique vertices</text>
  <text x="808" y="660" fill="#546170" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17">7.5 GiB — the only part that must be resident</text>
  <text x="808" y="688" fill="#546170" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17">the index array is returned as a dask graph, not materialized</text>
</svg>
